name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch ONNX Runtime (1.28)
        shell: pwsh
        run: |
          & .\scripts\fetch-ort.ps1

      - name: Configure ORT_LIB_PATH for this machine
        shell: pwsh
        run: |
          $lib = "$env:LOCALAPPDATA\asep-ort\onnxruntime-win-x64-1.28.0\lib"
          if (-not (Test-Path (Join-Path $lib 'onnxruntime.lib'))) {
            throw "ORT lib not found at $lib"
          }
          New-Item -ItemType Directory -Force -Path .cargo | Out-Null
          $content = "[env]`r`nORT_LIB_PATH = { value = `"$($lib.Replace('\', '\\'))`", force = true }`r`n"
          [IO.File]::WriteAllText((Join-Path (Get-Location) '.cargo/config.toml'), $content)
          Write-Output "ORT_LIB_PATH configured"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace
