[package]
name = "audio-separator-core"
description = "音频分离核心库：多架构本地推理与 MVSEP 云后端抽象"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }

# 本地推理引擎（ort 仅 2.0.0-rc 线可用，1.x 已全部 yanked；去 copy-dylibs 规避 Windows 复制 DLL 被占用问题，DLL 由构建脚本/手动放置）
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "api-27"] }
ndarray = "0.17"
num-complex = "0.4"
realfft = "3"

# 音频处理
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "aac", "isomp4", "pcm"] }
hound = "3"
rubato = "0.16"

# 模型获取
reqwest = { version = "0.12", features = ["blocking", "stream"] }
sha2 = "0.10"
dirs = "5"
