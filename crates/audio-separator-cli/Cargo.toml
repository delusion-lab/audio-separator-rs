[package]
name = "audio-separator-cli"
description = "音频分离命令行工具"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "asep"
path = "src/main.rs"

[dependencies]
audio-separator-core = { path = "../audio-separator-core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
