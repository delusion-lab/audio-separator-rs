[package]
name = "audio-separator-cli"
description = "Audio separation tool: local inference / MVSEP cloud API / HTTP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "asep"
path = "src/main.rs"

[dependencies]
audio-separator-core = { path = "../audio-separator-core" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync"] }
