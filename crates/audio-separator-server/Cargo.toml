[package]
name = "audio-separator-server"
description = "音频分离 HTTP 服务（axum：上传/任务/下载/取消，local 与 mvsep 双后端）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "audio-separator-server"
path = "src/main.rs"

[dependencies]
audio-separator-core = { path = "../audio-separator-core" }
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt", "io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
