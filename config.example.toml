# audio-separator-rs 配置示例
# 复制为 config.toml 后按需修改；所有字段均可省略（有默认值）。

backend = "local"          # local | mvsep

[models]
# 模型清单源：本地 JSON 路径或远程 URL（如 GitHub raw，独立模型仓库维护）。
# list = "https://raw.githubusercontent.com/<org>/audio-separator-models/main/models.json"
# list = "C:/path/to/models.json"
# 模型缓存目录（默认：系统缓存目录下 audio-separator-rs/models）
# cache_dir = "C:/Users/alice/.cache/audio-separator-rs/models"

[mvsep]
api_key = ""               # 或环境变量 ASEP_MVSEP_API_KEY
region = "auto"            # auto | de | de2 | sg
concurrency = 1            # 非 Premium 账号仅允许 1 个并发任务
poll_interval_secs = 5
poll_timeout_secs = 3600

[server]
addr = "127.0.0.1:8080"
# auth_token = "..."       # 启用后 API 请求需携带 Bearer Token
max_upload_bytes = 1000000000   # 上传大小上限（字节）

[output]
format = "wav"             # wav | flac | mp3 | m4a
